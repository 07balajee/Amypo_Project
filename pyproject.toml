[project]
name = "amypo-platform"
version = "0.1.0"
description = "Unified local AI request router + local DB Q&A platform (HackWithAMYPO 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "psutil>=6.0",
    "numpy>=1.26",
    "joblib>=1.4",
]

# Split by service so each container only installs what it needs (8 GB RAM budget, §3).
[project.optional-dependencies]
router = [
    "scikit-learn>=1.5",         # complexity classifier (M3/M5)
    "sentence-transformers>=3.0", # semantic cache embeddings (M5)
]
qa = [
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
]
dashboard = [
    "streamlit>=1.37",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "schemathesis>=3.35",
    "ruff>=0.5",
]
all = ["amypo-platform[router,qa,dashboard,dev]"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core.db" = ["*.sql"]
